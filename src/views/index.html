<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organize Tarefas</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="container my-4">

  <!-- Cabeçalho -->
  <div class="row align-items-center mb-4">
    <div class="col-12 col-md-6 d-flex align-items-center mb-3 mb-md-0">
      <img src="img/task-manager-icon-31.png" alt="logo" class="img-fluid me-2" width="48" />
      <h1 class="h5 mb-0">Lista de Tarefas</h1>
    </div>
    <div class="col-12 col-md-6 text-md-end">
      <div class="d-flex flex-column flex-sm-row justify-content-md-end gap-2">
        <select id="select_filter" class="form-select w-100 w-sm-auto">
          <option value=""></option>
          <option value="1">Filtro 1</option>
        </select>
        <a href="new.task.html" class="btn btn-primary d-flex align-items-center justify-content-center">
          <i class="bi bi-plus me-1"></i> Nova tarefa
        </a>
      </div>
    </div>
    <hr class="mt-4" />
  </div>

  <!-- Tarefa Exemplo (pode repetir esse bloco com diferentes conteúdos) -->
  <div class="row mb-3">
    <div class="col-12 border border-secondary rounded p-3 shadow-sm">
      <div class="row align-items-center gy-3">
        <div class="col-12 col-md-7 d-flex align-items-center">
          <i class="bi bi-arrow-right-circle-fill text-info fs-5 me-2"></i>
          <h6 class="mb-0">Lorem ipsum dolor sit amet consectetur adipisicing elit.</h6>
        </div>
        <div class="col-12 col-md-3">
          <select class="form-select">
            <option value="new">Novo</option>
            <option value="in progress">Em andamento</option>
            <option value="canceled">Cancelado</option>
            <option value="done">Concluído</option>
          </select>
        </div>
        <div class="col-12 col-md-2 d-flex justify-content-md-end justify-content-start gap-2">
          <button class="btn btn-outline-primary btn-sm">
            <i class="bi bi-pencil-square"></i> Editar
          </button>
          <button class="btn btn-outline-danger btn-sm">
            <i class="bi bi-trash3"></i> Deletar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Repetir acima para cada tarefa -->

  <!-- Total de tarefas -->
  <div class="row">
    <div class="col">
      <p>Tarefas: <span class="text-info">1</span></p>
    </div>
  </div>

  <!-- Sem tarefas -->
  <div class="row" id="no_tasks">
    <div class="col text-center">
      <span class="opacity-75">Não existem tarefas para apresentar</span>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="row mt-3">
    <div class="col text-center">
      <hr />
      <p>Lista de Tarefas &copy; 2025</p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
