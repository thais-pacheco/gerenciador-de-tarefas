<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organize Tarefas</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="container my-4">

  <!-- Cabeçalho -->
  <div class="row align-items-center mb-4">
    <div class="col-md-6 d-flex align-items-center">
      <img src="img/task-manager-icon-31.png" alt="logo" class="img-fluid me-3" width="48px"/>
      <h1 class="h4 mb-0">Lista de Tarefas</h1>
    </div>
   
    <hr>
  </div>

  <!--adicionar tarefa-->
  <div class="row">
    <div class="col">

      <h3>Editar tarefa</h3>
      <div class="mb-3">
        <input type="text" id="text_task_text" class="form-control" maxlength="100" placeholder="Adicione sua tarefa" value="">
      </div>
      <div class="text-center">
       <a href="index.html" class="btn btn-secondary">Cancelar</a>
       <button class="btn btn-primary" id="btn_guardar">Atualizar</button>
      </div>
    </div>
  </div>


  <!--footer-->
  <div class="row mt-3">
    <div class="col text-center">
      <hr>
      <p>Lista de Tarefas &copy; 2025</p>
    </div>
  </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
